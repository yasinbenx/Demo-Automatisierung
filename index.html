  <script>
    // Theme vor dem ersten Zeichnen setzen, damit nichts aufblitzt
    try {
      var t = JSON.parse(localStorage.getItem('habit.v1') || '{}').settings?.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
